<title>네 번의 겨울</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: samsung-memory-ppt-design-skill v2.1 덱 골격(20 x 11.25in = 1920 x 1080px, 1in = 96px)을 장면마다 적용.
   상단 줄 0.40in · 제목 0.86in(32pt 2줄) · 구분선 2.12in · 본문 2.34-9.45in · Blue 밴드 9.60in · 출처 줄 10.50in.
   1pt = 1.333px: 제목 43px · 구획 제목 32px · 본문 24-29px · 빅넘버 64px · 눈금 22px · 출처 20px. */
:root{
  --samsung-blue:#1428a0;   /* 유일한 액센트 */
  --blue-t1:#3c5ac8;
  --blue-t2:#aab8e8;
  --tint:#eef1fa;
  --ink:#1a1a1a;            /* 순수 검정 금지 */
  --gray:#555555;           /* 보조 텍스트·축 */
  --gray-2:#8a8a8a;         /* 경쟁사 계열 */
  --line:#d9d9d9;
  --pale:#f5f5f5;
  --bg:#ffffff;
  --negative:#d93025;       /* 리스크 의미에만 */
  --page:#eef0f4;           /* 무대 바깥 페이지 */
  --f:"SamsungOneKorean","SamsungOne","Pretendard","Noto Sans KR",Arial,sans-serif;
  color-scheme:light;
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f);padding-inline:16px;padding-block:16px 24px}
.player{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.viewport{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg);word-break:keep-all;font-feature-settings:"tnum";color:var(--ink)}
.stage *,.stage *::before,.stage *::after{box-sizing:border-box}
#bg{position:absolute;inset:0;width:1920px;height:1080px}
.scene{position:absolute;inset:0;visibility:hidden;opacity:0}
.a{position:absolute}
.b{color:var(--samsung-blue)}.n{color:var(--negative)}.g{color:var(--gray)}

/* 덱 골격 */
.top{position:absolute;left:76px;top:38px;font-size:24px;color:var(--gray);white-space:pre}
.top b{color:var(--samsung-blue);font-weight:700}
.grade{position:absolute;right:76px;top:38px;font-size:24px;color:var(--gray)}
.ttl{position:absolute;left:76px;top:83px;width:1768px;height:108px;display:flex;flex-direction:column;justify-content:center;font-size:43px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.rule{position:absolute;left:76px;top:204px;width:1768px;height:2px;background:var(--line)}
.band{position:absolute;left:76px;top:922px;width:1768px;height:77px;background:var(--samsung-blue);display:flex;align-items:center}
.band .bt{flex:0 0 168px;padding-left:38px;font-size:27px;color:var(--blue-t2)}
.band .bx{font-size:32px;font-weight:700;color:#fff;white-space:nowrap}
.src{position:absolute;left:76px;top:1008px;width:1622px;font-size:20px;line-height:1.3;color:var(--gray)}
.pg{position:absolute;right:76px;top:1008px;font-size:21px;color:var(--gray)}
.ph{position:absolute;display:flex;align-items:center;gap:16px;font-size:32px;font-weight:700;white-space:nowrap}
.ph i{font-style:normal;flex:0 0 46px;height:46px;border-radius:50%;background:var(--samsung-blue);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.lab{font-size:24px;color:var(--gray)}
.big{font-size:64px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tag{display:inline-block;font-size:22px;font-weight:700;color:var(--samsung-blue);border:2px solid var(--samsung-blue);border-radius:4px;padding:0 10px;line-height:1.4}

/* 로고 (11.F: 워드마크 0.25-0.30in, 심볼형 0.34-0.46in) · 워드마크 칩 */
.logo{display:inline-flex;align-items:center}
.logo svg{height:27px;width:auto;display:block}
.logo.sk svg{height:42px}
.tile .logo.sk svg{height:70px}
.wm{display:inline-block;font-size:22px;font-weight:700;color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:0 10px;line-height:1.35}
.wm.x{color:var(--gray-2);border-color:var(--gray-2)}

/* 차트 요소 */
.hb{position:absolute;height:40px;transform-origin:0 50%}
.vb{position:absolute;transform-origin:50% 100%}
.v{position:absolute;font-size:26px;font-weight:700;white-space:nowrap}
.x{position:absolute;font-size:22px;color:var(--gray);white-space:nowrap;text-align:center}
.tile{position:absolute;width:280px;height:150px;border:2px solid var(--line);border-radius:4px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.tile.me{border-color:var(--samsung-blue)}
.tile.ghost{border-style:dashed}
.tile .t2{font-size:22px;font-weight:700;color:var(--gray)}
.tl-item{position:absolute;left:0;display:flex;gap:22px;align-items:baseline}
.tl-item .d{flex:0 0 150px;font-size:24px;font-weight:700;color:var(--samsung-blue)}
.tl-item .t{font-size:28px;font-weight:700}
.dia{position:absolute;width:18px;height:18px;background:var(--samsung-blue);transform:rotate(45deg)}
.box{position:absolute;border-radius:4px;background:var(--pale);border:1.5px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:0 22px;gap:4px}
.box.on{background:var(--samsung-blue);border-color:var(--samsung-blue);color:#fff}
.box .d{font-size:22px;font-weight:700;color:var(--samsung-blue)}
.box.on .d{color:var(--blue-t2)}
.box .t{font-size:26px;font-weight:700;line-height:1.25}
.arr{position:absolute;width:0;height:0;border-left:18px solid var(--gray-2);border-top:12px solid transparent;border-bottom:12px solid transparent}
.news{position:absolute;left:880px;width:964px;height:184px;background:#fff;border:1.5px solid var(--line);border-top:4px solid var(--ink);padding:16px 28px 0}
.news .m{display:flex;gap:14px;align-items:center;font-size:22px;color:var(--gray)}
.news .m b{font-weight:700;color:var(--gray);border:1.5px solid var(--gray-2);border-radius:3px;padding:0 8px}
.news .h{font-size:32px;font-weight:700;line-height:1.3;margin-top:8px}

/* 컨트롤 (페이지 UI) */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font:400 13px var(--f);color:var(--gray)}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:700 13px var(--f);padding:8px 14px;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--samsung-blue)}
.btn:focus-visible,#scrub:focus-visible{outline:2px solid var(--samsung-blue);outline-offset:2px}
.btn.play{background:var(--samsung-blue);border-color:var(--samsung-blue);color:#fff;min-width:84px}
.btn.snd{border-color:var(--samsung-blue);color:var(--samsung-blue);min-width:108px}
.btn.snd.on{background:var(--samsung-blue);color:#fff}
#time{font-variant-numeric:tabular-nums;min-width:84px}
.scrubwrap{flex:1 1 240px;min-width:0;display:flex;align-items:center}
#scrub{width:100%;accent-color:var(--samsung-blue)}
.note{font-size:12px;color:var(--gray);line-height:1.6;margin:0}
.player:fullscreen{max-width:none;background:var(--page);justify-content:center;padding:16px}
.player:fullscreen .viewport{width:min(100%,calc((100vh - 90px) * 16 / 9));margin:0 auto}
body.export{padding:0;margin:0}
body.export .player{max-width:none;gap:0}
body.export .controls,body.export .note{display:none}
body.export .viewport{border:0}
</style>

}
